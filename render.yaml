services:
  - type: web
    name: home-workout-tracker
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: home-workout-tracker-db
          property: connectionString
      - key: ADMIN_EMAILS
        sync: false
databases:
  - name: home-workout-tracker-db
    plan: free
    databaseName: fittracker
    user: fittracker
